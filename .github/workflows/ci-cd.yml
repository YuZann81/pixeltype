name: CI/CD Pipeline

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  ci:
    name: Build & Verify
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Type check & lint
        run: npm run lint

      - name: Build frontend and Express server runtime
        run: npm run build

      - name: Verify runtime build outputs and secret isolation
        run: |
          test -f dist/index.html || { echo "Missing dist/index.html"; exit 1; }
          test -d dist/assets || { echo "Missing dist/assets"; exit 1; }
          test -f dist-server/index.mjs || { echo "Missing dist-server/index.mjs"; exit 1; }
          if grep -rnE 'P2R_CLIENT_SECRET|P2R_CLIENT_ID' dist/; then
            echo "::error::Server credential identifiers leaked into client dist/ bundle."
            exit 1
          fi
          echo "Frontend bundle and Express server runtime verified."

      - name: Upload runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: pixeltype-runtime
          path: |
            dist/
            dist-server/
            package.json
            package-lock.json
            Dockerfile
            .dockerignore
          retention-days: 7
          if-no-files-found: error

  deploy:
    name: Deploy Express Runtime to Production VPS
    needs: ci
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest

    steps:
      - name: Check deployment secrets
        id: secrets_check
        env:
          SSH_KEY: ${{ secrets.SUMAPOD_SSH_KEY }}
          SSH_HOST: ${{ secrets.SUMAPOD_SSH_HOST }}
          SSH_USER: ${{ secrets.SUMAPOD_SSH_USER }}
        run: |
          if [ -z "$SSH_KEY" ] || [ -z "$SSH_HOST" ] || [ -z "$SSH_USER" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Deployment SSH secrets are not fully configured. Skipping production deployment."
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Download runtime artifact
        if: steps.secrets_check.outputs.configured == 'true'
        uses: actions/download-artifact@v4
        with:
          name: pixeltype-runtime
          path: runtime-release

      - name: Verify runtime artifact integrity
        if: steps.secrets_check.outputs.configured == 'true'
        run: |
          test -f runtime-release/dist/index.html || { echo "Missing dist/index.html"; exit 1; }
          test -d runtime-release/dist/assets || { echo "Missing dist/assets"; exit 1; }
          test -f runtime-release/dist-server/index.mjs || { echo "Missing dist-server/index.mjs"; exit 1; }
          test -f runtime-release/package.json || { echo "Missing package.json"; exit 1; }
          test -f runtime-release/package-lock.json || { echo "Missing package-lock.json"; exit 1; }
          echo "Runtime artifact verified."

      - name: Setup SSH
        if: steps.secrets_check.outputs.configured == 'true'
        env:
          SSH_KEY: ${{ secrets.SUMAPOD_SSH_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SUMAPOD_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Package and transfer Express runtime release
        if: steps.secrets_check.outputs.configured == 'true'
        env:
          SSH_HOST: ${{ secrets.SUMAPOD_SSH_HOST }}
          SSH_USER: ${{ secrets.SUMAPOD_SSH_USER }}
        run: |
          RELEASE_ID="${GITHUB_SHA::8}-${GITHUB_RUN_ID}"
          echo "Deploying Express runtime release: ${RELEASE_ID}"

          tar -czf pixeltype-runtime.tar.gz -C runtime-release .

          ssh -i ~/.ssh/deploy_key "${SSH_USER}@${SSH_HOST}" "mkdir -p /var/www/pixeltype/releases/${RELEASE_ID}"
          scp -i ~/.ssh/deploy_key pixeltype-runtime.tar.gz "${SSH_USER}@${SSH_HOST}:/var/www/pixeltype/releases/${RELEASE_ID}/pixeltype-runtime.tar.gz"

          ssh -i ~/.ssh/deploy_key "${SSH_USER}@${SSH_HOST}" "
            set -euo pipefail
            cd /var/www/pixeltype/releases/${RELEASE_ID}
            tar -xzf pixeltype-runtime.tar.gz
            rm pixeltype-runtime.tar.gz
            [ -f dist/index.html ] && [ -d dist/assets ] && [ -f dist-server/index.mjs ]
            npm ci --omit=dev
          "

      - name: Publish runtime release (atomic swap)
        if: steps.secrets_check.outputs.configured == 'true'
        env:
          SSH_HOST: ${{ secrets.SUMAPOD_SSH_HOST }}
          SSH_USER: ${{ secrets.SUMAPOD_SSH_USER }}
          RESTART_CMD: ${{ vars.PIXELTYPE_RESTART_CMD }}
        run: |
          RELEASE_ID="${GITHUB_SHA::8}-${GITHUB_RUN_ID}"
          ssh -i ~/.ssh/deploy_key "${SSH_USER}@${SSH_HOST}" "
            set -euo pipefail

            # Record current active release for rollback
            if [ -L /var/www/pixeltype/current ]; then
              CURRENT_TARGET=\$(readlink -f /var/www/pixeltype/current)
              ln -sfn \"\$CURRENT_TARGET\" /var/www/pixeltype/previous
            fi

            # Atomically switch current runtime symlink to new release
            ln -sfn /var/www/pixeltype/releases/${RELEASE_ID} /var/www/pixeltype/current_tmp
            mv -Tf /var/www/pixeltype/current_tmp /var/www/pixeltype/current

            # Keep legacy dist symlink pointed at current/dist for host compatibility
            ln -sfn /var/www/pixeltype/current/dist /var/www/pixeltype/dist_tmp
            mv -Tf /var/www/pixeltype/dist_tmp /var/www/pixeltype/dist

            # Prune older releases, keeping the 5 most recent
            cd /var/www/pixeltype/releases
            ls -dt */ | tail -n +6 | xargs -r rm -rf
          "

          if [ -n "$RESTART_CMD" ]; then
            ssh -i ~/.ssh/deploy_key "${SSH_USER}@${SSH_HOST}" "$RESTART_CMD"
          else
            echo "::notice::PIXELTYPE_RESTART_CMD repository variable is unset; activate/restart the Express runtime service (or rebuild Docker container) on host."
          fi

      - name: Verify live deployment via HTTPS (when public URL is configured)
        if: steps.secrets_check.outputs.configured == 'true'
        env:
          PUBLIC_URL: ${{ vars.PIXELTYPE_PUBLIC_URL }}
        run: |
          if [ -z "$PUBLIC_URL" ]; then
            echo "::notice::PIXELTYPE_PUBLIC_URL is not configured yet. Skipping public HTTPS smoke checks until the production domain is confirmed."
            exit 0
          fi

          BASE_URL="${PUBLIC_URL%/}"
          echo "Verifying live endpoints at ${BASE_URL}..."
          curl -fsSI "${BASE_URL}/"
          curl -fsSI "${BASE_URL}/gameplay"
          curl -fsSI "${BASE_URL}/leaderboard"
          curl -fsS "${BASE_URL}/api/health"

          # Verify unauthenticated BFF game-token route rejects with HTTP 401
          BFF_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -X POST "${BASE_URL}/api/bff/game-token")
          if [ "$BFF_STATUS" != "401" ]; then
            echo "BFF check failed: expected HTTP 401, got $BFF_STATUS"
            exit 1
          fi
          echo "BFF unauthenticated check passed (HTTP 401)."
          echo "Deployment verified successfully."
